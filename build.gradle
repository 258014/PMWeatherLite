plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.3.4'
group = 'com.stellar.pmwlite'

base {
    archivesName = 'PMWeatherLite'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Deterministic build stamp (see the jar manifest below). SOURCE_DATE_EPOCH wins when set.
project.ext.buildTimestamp = {
    def epoch = System.getenv('SOURCE_DATE_EPOCH')
    if (epoch != null && epoch.isInteger()) {
        return new Date(Long.parseLong(epoch) * 1000L).format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))
    }
    return '2000-01-01T00:00:00Z'
}()

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                pmwlite {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                pmwlite {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            args '--mod', 'pmwlite', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                pmwlite {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "PMWeatherLite",
                "Specification-Vendor"    : "stellar",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "stellar",
                // REPRODUCIBLE BUILD: never embed the wall-clock time. Use SOURCE_DATE_EPOCH
                // when the CI/user provides one, otherwise a fixed stamp. Combined with the
                // archive options below, `./gradlew build` is byte-for-byte reproducible,
                // so a third party can verify that a published jar was built from this source.
                "Implementation-Timestamp": project.ext.buildTimestamp
        ])
    }
}

// Reproducible archives: stable entry order + fixed entry timestamps.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
